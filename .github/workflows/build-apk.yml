name: Build xemu Android APK

on:
    workflow_dispatch:
        inputs:
            build_type:
                description: 'Build type'
                required: true
                default: 'debug'
                type: choice
                options:
                    - debug
                    - release
            enable_xiso_converter:
                description: 'Enable ISO->XISO converter (requires Rust)'
                required: true
                default: 'true'
                type: choice
                options:
                    - 'true'
                    - 'false'

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            MODULE: app
            NDK_VERSION: 29.0.14206865
            CMAKE_VERSION: 3.30.3
            JAVA_TOOL_OPTIONS: ""
            _JAVA_OPTIONS: ""
            JDK_JAVA_OPTIONS: ""

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: zulu
                  java-version: '21'

            - name: Set up Android SDK components
              uses: android-actions/setup-android@v3

            - name: Install Android SDK 36, Build Tools & NDK
              run: |
                  sdkmanager --install \
                    "platforms;android-36" \
                    "build-tools;36.1.0" \
                    "ndk;${{ env.NDK_VERSION }}" \
                    "cmake;${{ env.CMAKE_VERSION }}"

            - name: Set up Rust (aarch64-linux-android)
              if: github.event.inputs.enable_xiso_converter == 'true'
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-linux-android

            - name: Cache Rust registry & build
              if: github.event.inputs.enable_xiso_converter == 'true'
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-

            - name: Cache Gradle dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
                  restore-keys: ${{ runner.os }}-gradle-

            - name: Make Gradle executable
              run: chmod +x ./android/gradlew

            - name: Decode Keystore
              if: github.event.inputs.build_type == 'release'
              run: |
                  echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/keystore.jks

            - name: Create keystore.properties
              if: github.event.inputs.build_type == 'release'
              run: |
                  cat > android/keystore.properties <<EOF
                  storeFile=${{ github.workspace }}/keystore.jks
                  storePassword=${{ secrets.KEYSTORE_PASSWORD }}
                  keyAlias=${{ secrets.KEY_ALIAS }}
                  keyPassword=${{ secrets.KEY_PASSWORD }}
                  EOF

            - name: Build debug APK
              if: github.event.inputs.build_type == 'debug'
              working-directory: android
              run: |
                  XISO_FLAG=""
                  if [ "${{ github.event.inputs.enable_xiso_converter }}" == "false" ]; then
                    XISO_FLAG='-Pandroid.experimental.cmake.arguments=-DXEMU_ENABLE_XISO_CONVERTER=OFF'
                  fi
                  ./gradlew assembleDebug $XISO_FLAG \
                    --no-daemon \
                    --stacktrace
              env:
                  ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

            - name: Build release APK
              if: github.event.inputs.build_type == 'release'
              working-directory: android
              run: |
                  XISO_FLAG=""
                  if [ "${{ github.event.inputs.enable_xiso_converter }}" == "false" ]; then
                    XISO_FLAG='-Pandroid.experimental.cmake.arguments=-DXEMU_ENABLE_XISO_CONVERTER=OFF'
                  fi
                  ./gradlew assembleRelease $XISO_FLAG \
                    --no-daemon \
                    --stacktrace
              env:
                  ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

            - name: Upload debug APK
              if: github.event.inputs.build_type == 'debug'
              uses: actions/upload-artifact@v4
              with:
                  name: xemu-android-debug-${{ github.sha }}
                  path: android/${{ env.MODULE }}/build/outputs/apk/debug/*.apk
                  if-no-files-found: error

            - name: Upload release APK
              if: github.event.inputs.build_type == 'release'
              uses: actions/upload-artifact@v4
              with:
                  name: xemu-android-release-${{ github.sha }}
                  path: android/${{ env.MODULE }}/build/outputs/apk/release/*.apk
                  if-no-files-found: error
